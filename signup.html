<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EyeGuard Sign Up</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-container">
    <h1>Create New Account</h1>

    <form id="signupForm">
      <input type="text" id="username" placeholder="Enter Name" autocomplete="name" required>

      <input type="email" id="email" placeholder="Enter Email" autocomplete="email" required>

      <input type="password" id="password" placeholder="Set Password" autocomplete="new-password" required>

      <input 
        type="tel" 
        id="mobile" 
        placeholder="Emergency Number" 
        pattern="[0-9]{10}" 
        maxlength="10"
        autocomplete="tel"
        required
      >

      <button type="submit">Sign Up</button>
    </form>

    <br>
<button type="button" id="googleSignupBtn" class="google-btn">
    <img src="https://developers.google.com/identity/images/g-logo.png"
         width="20"
         height="20"
         style="vertical-align:middle;margin-right:10px;">
    Continue with Google
</button>
    <button type="button" onclick="window.location.href='login.html'">
      Already have an account? Login
    </button>
  </div>

  <!-- Firebase SDK -->
   
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="signup.js"></script>

  <script src="signup.js"></script>
</body>
</html>

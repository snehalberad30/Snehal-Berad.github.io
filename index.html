<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EyeGuard</title>

  <link rel="stylesheet" href="style2.css">
  <link rel="icon" href="data:,">
</head>

<body>

  <script>
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "login.html";
    }
  </script>

  <div class="app-shell">

    <!-- LEFT PANEL -->
    <section class="left-panel">

      <div id="roadPanel">
        <h3>Road Condition & Weather</h3>

        <p>🌦 Weather: <span id="weather">--</span></p>
        <p>👁️ Visibility: <span id="visibility">--</span></p>
        <p>🌡 Temperature: <span id="temp">--</span></p>
        <p>💧 Humidity: <span id="humidity">--</span></p>

        <p id="roadWarning"></p>

        <button id="checkRoadBtn">Check Road Condition</button>
      </div>

      <div id="drivePanel">
        <h3>Driving Stats</h3>

        <p>⏱ Driving Time: <span id="driveTime">0 min</span></p>
        <p>🚗 Speed: <span id="speed">0 km/h</span></p>
        <p id="speedBox">Speed: 0 km/h</p>
        <p id="driveAlert"></p>
      </div>

    </section>

    <!-- CENTER PANEL -->
    <main class="center-panel">

      <div id="alertList"></div>

      <h1>
        <img src="camera.png" class="icon" alt="EyeGuard Icon">
        EyeGuard
        <img src="camera.png" class="icon" alt="EyeGuard Icon">
      </h1>

      <div class="camera-box">
        <video id="video" autoplay muted></video>
        <canvas id="overlay" width="640" height="480"></canvas>
      </div>

      <p id="status">Status: Active</p>

      <div class="main-controls">
        <button id="startBtn">🟢 Start Camera</button>
        <button id="stopBtn">🔴 Stop Camera</button>
      </div>

      <div class="extra-controls">
        <button id="themeToggle">🌙 Toggle Dark/Light</button>

        <div class="language-box">
          <label for="langSelect">🌐 Language</label>
          <select id="langSelect">
            <option value="en">English</option>
            <option value="mr">मराठी</option>
            <option value="hi">हिंदी</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
      </div>

      <p id="emergencyDisplay"></p>

      <div class="safety-controls">
        <button id="emergencyBtn">📞 Emergency Call</button>
        <button id="sendLocationBtn">📍 Send Live Location</button>
      </div>

      <div id="locationStatus"></div>

    </main>

    <!-- RIGHT PANEL -->
    <aside class="right-panel">

      <div id="topRightButtons">
        <button id="mapBtn">📍 View Map</button>
        <button id="voiceBtn">🎤 Voice</button>

        <button type="button" onclick="window.location.href='admin-login.html'">
          Admin Dashboard
        </button>

        <button id="logoutBtn">🔓 Logout</button>
      </div>

      <p id="result">Say a command...</p>

    </aside>

  </div>

  <script>
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("loggedIn");
      localStorage.removeItem("username");
      localStorage.removeItem("email");
      localStorage.removeItem("mobile");
      window.location.href = "login.html";
    });
  </script>

  <!-- Face API + Howler -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>

  <!-- Firebase Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- Weather API Key -->
  <script>
    const WEATHER_API_KEY = "9003f715a38b51c72cd0e90ae4875502";
  </script>

  <!-- Main JS -->
  <script defer src="script3.js"></script>

</body>
</html>
